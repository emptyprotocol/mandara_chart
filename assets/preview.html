<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mandala Chart</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 100%);
    color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo',
                 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .icon {
    display: grid;
    grid-template-columns: repeat(3, 22px);
    grid-template-rows: repeat(3, 22px);
    gap: 3px;
    margin-bottom: 18px;
  }
  .icon > div { background: #e2b96f; border-radius: 3px; opacity: 0.45; }
  .icon > div:nth-child(5) { opacity: 1; }
  h2 { margin: 0 0 10px; font-size: 22px; color: #e2b96f; font-weight: 700; }
  .theme {
    margin: 4px 0 18px;
    font-size: 17px;
    line-height: 1.4;
    color: #fff;
    word-break: break-word;
    max-width: 92%;
    font-weight: 600;
  }
  p { margin: 0; color: #aaa; font-size: 13px; line-height: 1.5; }
  a.full {
    margin-top: 22px;
    display: inline-block;
    background: #e2b96f;
    color: #1a1a2e;
    padding: 12px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
  }
  a.full:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div class="icon"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <h2 id="lblTitle">マンダラチャート</h2>
  <div class="theme" id="theme"></div>
  <p id="hint">タップで全画面表示</p>
  <a class="full" id="btn" href="#">9×9を開く</a>

<script>
  // Lightweight: read t/l from URL directly, never decode the heavy d=.
  // Forward the d= blob verbatim to mandala.html on tap.
  (function () {
    try {
      const params = new URLSearchParams(location.search);
      const theme = params.get('t') || '';
      const lang = params.get('l') === 'en' ? 'en' : 'ja';
      const d = params.get('d') || '';

      if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.getElementById('lblTitle').textContent = 'Mandala Chart';
        document.getElementById('hint').textContent = 'Tap to open full size';
        document.getElementById('btn').textContent = 'Open 9×9 grid';
      }
      document.getElementById('theme').textContent = theme;
      document.getElementById('btn').href = 'mandala.html?d=' + encodeURIComponent(d);
    } catch (_) { /* ignore */ }
  })();
</script>
</body>
</html>
