<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mandala</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #1a1a2e;
    color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', system-ui, sans-serif;
    text-align: center;
    padding: 28px 18px;
    box-sizing: border-box;
  }
  h2 { color: #e2b96f; font-size: 20px; margin: 0 0 14px; font-weight: 700; }
  .theme { font-size: 16px; line-height: 1.4; margin: 0 0 18px; word-break: break-word; }
  a.btn {
    display: inline-block;
    background: #e2b96f;
    color: #1a1a2e;
    padding: 10px 22px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
  }
</style>
</head>
<body>
  <h2 id="lbl">マンダラチャート</h2>
  <div class="theme" id="theme"></div>
  <a class="btn" id="btn" href="#">9×9を開く</a>
  <script>
    var p = new URLSearchParams(location.search);
    var t = p.get('t') || '';
    var l = p.get('l') === 'en' ? 'en' : 'ja';
    var d = p.get('d') || '';
    if (l === 'en') {
      document.documentElement.lang = 'en';
      document.getElementById('lbl').textContent = 'Mandala Chart';
      document.getElementById('btn').textContent = 'Open 9x9';
    }
    document.getElementById('theme').textContent = t;
    document.getElementById('btn').href = 'mandala.html?d=' + encodeURIComponent(d);
  </script>
</body>
</html>
