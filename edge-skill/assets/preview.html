<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mandala Chart</title>
<style>
  html, body { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 100%);
    color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo',
                 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    padding: 22px 18px 26px;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .icon {
    display: inline-grid;
    grid-template-columns: repeat(3, 18px);
    grid-template-rows: repeat(3, 18px);
    gap: 3px;
    margin: 0 auto 14px;
  }
  .icon > div { background: #e2b96f; border-radius: 3px; opacity: 0.45; }
  .icon > div:nth-child(5) { opacity: 1; }
  h2 {
    margin: 0 0 8px;
    font-size: 18px;
    color: #e2b96f;
    font-weight: 700;
  }
  .theme {
    margin: 4px 0 14px;
    font-size: 15px;
    line-height: 1.4;
    color: #fff;
    word-break: break-word;
    font-weight: 600;
  }
  p { margin: 0; color: #aaa; font-size: 12px; line-height: 1.5; }
  a.full {
    margin-top: 16px;
    display: inline-block;
    background: #e2b96f;
    color: #1a1a2e;
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    text-decoration: none;
  }
  a.full:active { transform: scale(0.96); }
</style>
</head>
<body>
  <div class="icon"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <h2 id="lblTitle">マンダラチャート</h2>
  <div class="theme" id="theme"></div>
  <p id="hint">タップで全画面表示</p>
  <a class="full" id="btn" href="#">9×9を開く</a>

<script>
  (function () {
    try {
      var p = new URLSearchParams(location.search);
      var theme = p.get('t') || '';
      var lang = p.get('l') === 'en' ? 'en' : 'ja';
      var d = p.get('d') || '';
      if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.getElementById('lblTitle').textContent = 'Mandala Chart';
        document.getElementById('hint').textContent = 'Tap to open full size';
        document.getElementById('btn').textContent = 'Open 9×9 grid';
      }
      document.getElementById('theme').textContent = theme;
      document.getElementById('btn').href = 'mandala.html?d=' + encodeURIComponent(d);
    } catch (_) {}
  })();
</script>
</body>
</html>
