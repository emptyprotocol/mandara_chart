<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Mandala Chart</title>
<style>
  body {
    margin: 0;
    height: 200vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 100%);
    color: #fff;
    font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo',
                 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }
  .icon { font-size: 56px; margin-bottom: 12px; line-height: 1; }
  h2 { margin: 0 0 12px; font-size: 22px; color: #e2b96f; font-weight: 700; }
  .theme { margin: 4px 0 18px; font-size: 16px; color: #fff; word-break: break-word; max-width: 90%; }
  p { margin: 0 0 20px; color: #aaa; font-size: 13px; line-height: 1.6; }
  .btn {
    background: #e2b96f;
    color: #1a1a2e;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    box-shadow: 0 6px 16px rgba(226,185,111,0.3);
  }
  .btn:active { transform: scale(0.96); }
  .grid-mini {
    display: grid;
    grid-template-columns: repeat(3, 18px);
    grid-template-rows: repeat(3, 18px);
    gap: 2px;
    margin-bottom: 16px;
  }
  .grid-mini > div { background: #e2b96f; border-radius: 2px; opacity: 0.4; }
  .grid-mini > div:nth-child(5) { opacity: 1; }
</style>
</head>
<body>
  <div class="grid-mini">
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
    <div></div><div></div><div></div>
  </div>
  <h2 id="lblTitle">マンダラチャート完成</h2>
  <div class="theme" id="theme"></div>
  <p id="hint">タップして9×9グリッドを開く</p>
  <div class="btn" id="btn">開く</div>

<script>
  (function () {
    const params = new URLSearchParams(location.search);
    const d = params.get('d') || '';

    // Decode just the mainTheme + language for the preview label
    let mainTheme = '';
    let lang = 'ja';
    try {
      const decoded = decodeURIComponent(escape(atob(d)));
      const obj = JSON.parse(decoded);
      mainTheme = obj.mainTheme || '';
      lang = obj.language === 'en' ? 'en' : 'ja';
    } catch (e) {
      // best-effort; leave defaults
    }

    if (lang === 'en') {
      document.documentElement.lang = 'en';
      document.getElementById('lblTitle').textContent = 'Mandala Chart Ready';
      document.getElementById('hint').textContent = 'Tap to open the 9x9 grid';
      document.getElementById('btn').textContent = 'Open';
    }
    document.getElementById('theme').textContent = mainTheme;

    const target = 'mandala.html?d=' + encodeURIComponent(d) + '&v=' + Date.now();
    const go = (e) => {
      if (e) e.preventDefault();
      window.location.href = target;
    };
    document.body.addEventListener('click', go);
    document.body.addEventListener('touchstart', go, { passive: true });
  })();
</script>
</body>
</html>
